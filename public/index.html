<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Sinyal Paneli (JSON Entegrasyonlu)</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 0; background: #131722; color: #d1d4dc; font-family: 'Segoe UI', sans-serif; }
        
        /* HEADER */
        .app-header { padding: 20px; border-bottom: 1px solid #2a2e39; display: flex; justify-content: space-between; align-items: center; background: #1e222d;}
        h2 { margin: 0; font-size: 20px; }
        .stats { font-size: 14px; color: #787b86; }

        /* GRID */
        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* CARD */
        .card {
            background: #1e222d; border-radius: 8px; padding: 20px; cursor: pointer;
            border: 1px solid #2a2e39; position: relative; overflow: hidden;
            transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-color: #444; }

        /* DURUM ETİKETLERİ */
        .badge { position: absolute; top: 15px; right: 15px; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .badge-waiting { background: #FF9800; color: #fff; } 
        .badge-active { background: #2962FF; color: #fff; animation: pulse 1.5s infinite; } 
        .badge-tp { background: #00E676; color: #000; } 
        .badge-sl { background: #FF5252; color: #fff; } 

        /* İÇERİK */
        .symbol { font-size: 20px; font-weight: bold; }
        .dir { font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 3px; margin-left: 10px; }
        .long { color: #00E676; border: 1px solid #00E676; }
        .short { color: #FF5252; border: 1px solid #FF5252; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; font-size: 13px; color: #b2b5be; }
        .info-val { font-family: 'Courier New', monospace; font-weight: bold; color: #d1d4dc; }
        
        .result-box { margin-top: 15px; padding-top: 10px; border-top: 1px solid #2a2e39; display: flex; justify-content: space-between; align-items: center; }
        .pnl { font-size: 16px; font-weight: bold; }

        /* MODAL */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #131722; z-index: 100; }
        #chart-area { width: 100%; height: 100%; }
        #close-btn { position: absolute; top: 20px; right: 20px; z-index: 110; padding: 10px 20px; background: #2a2e39; color: white; border: none; cursor: pointer; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-header">
        <h2>🤖 Sinyal Bot Paneli</h2>
        <div class="stats" id="status-msg">Veriler Bekleniyor...</div>
    </div>

    <div id="dashboard"></div>

    <div id="modal">
        <button id="close-btn" onclick="closeModal()">KAPAT X</button>
        <div id="chart-area"></div>
    </div>

    <script>
        // ---------------------------------------------------------
        // 1. GLOBAL DEĞİŞKENLER
        // ---------------------------------------------------------
        let signals = []; // Artık boş başlıyoruz, JSON'dan dolacak
        let activeSocket = null; // WebSocket bağlantısını yönetmek için

        // ---------------------------------------------------------
        // 2. VERİ ÇEKME VE ANALİZ MOTORU
        // ---------------------------------------------------------
        async function fetchAndAnalyze() {
            const statusMsg = document.getElementById('status-msg');
            const dashboard = document.getElementById('dashboard');

            try {
                // Önbellek sorununu aşmak için tarih damgası ekliyoruz (?v=...)
                // Eğer GitHub Raw URL kullanacaksanız buraya tam URL'yi yazın.
                const response = await fetch('signals.json?v=' + new Date().getTime());
                
                if (!response.ok) throw new Error("Dosya bulunamadı");
                
                const newSignals = await response.json();

                // Eğer veri değişmediyse işlem yapma (Performans için)
                if (JSON.stringify(newSignals) === JSON.stringify(signals) && signals.length > 0) {
                    console.log("Veri güncel, değişiklik yok.");
                    return; 
                }

                signals = newSignals;
                
                // Tarihe göre sırala (En yeni en üstte)
                signals.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                statusMsg.innerText = `Son Güncelleme: ${new Date().toLocaleTimeString()}`;

                // Backtest Analizi (Geçmiş Mumları Tara)
                for (let sig of signals) {
                    await processSignalHistory(sig);
                }

                renderDashboard();
                restartLiveUpdates(); // Yeni semboller için socketi yeniden başlat

            } catch (error) {
                console.error("Hata:", error);
                if(signals.length === 0) {
                    dashboard.innerHTML = `<div style="padding:20px; color:#FF5252">Veri çekilemedi: ${error.message}</div>`;
                }
            }
        }

        async function processSignalHistory(sig) {
            // Varsayılan durum
            sig.status = 'WAITING';
            sig.pnl = 0;
            sig.currentPrice = 0;

            // CryptoCompare API (Backtest)
            const signalTs = Math.floor(new Date(sig.date).getTime() / 1000);
            const nowTs = Math.floor(Date.now() / 1000);
            const url = `https://min-api.cryptocompare.com/data/v2/histominute?fsym=${sig.symbol.replace('USDT','')}&tsym=USDT&limit=500&toTs=${nowTs}`;
            
            try {
                const res = await fetch(url);
                const json = await res.json();
                
                if (json.Response === 'Success') {
                    const candles = json.Data.Data;
                    const relevantCandles = candles.filter(c => c.time >= signalTs);
                    
                    if(relevantCandles.length > 0) {
                         sig.currentPrice = relevantCandles[relevantCandles.length - 1].close;
                    }

                    let isActive = false;

                    for (let c of relevantCandles) {
                        if (!isActive) {
                            if (checkEntry(c, sig)) {
                                isActive = true;
                                sig.status = 'ACTIVE';
                            }
                        }
                        if (isActive) {
                            if (checkTP(c, sig)) { sig.status = 'TP'; break; }
                            if (checkSL(c, sig)) { sig.status = 'SL'; break; }
                        }
                    }
                }
            } catch (e) {
                console.error("Backtest hatası:", sig.symbol, e);
            }
        }

        // --- YARDIMCI MANTIK ---
        function checkEntry(candle, sig) { return (sig.entry >= candle.low && sig.entry <= candle.high); }
        function checkTP(candle, sig) { 
            return (sig.dir === 'LONG' && candle.high >= sig.tp) || (sig.dir === 'SHORT' && candle.low <= sig.tp);
        }
        function checkSL(candle, sig) {
            return (sig.dir === 'LONG' && candle.low <= sig.sl) || (sig.dir === 'SHORT' && candle.high >= sig.sl);
        }

        // ---------------------------------------------------------
        // 3. EKRANA ÇİZME (RENDER)
        // ---------------------------------------------------------
        function renderDashboard() {
            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            // Sıralama: Aktif > Bekleyen > Biten
            const sortedSignals = [...signals].sort((a, b) => {
                const order = { 'ACTIVE': 1, 'WAITING': 2, 'TP': 3, 'SL': 4 };
                return (order[a.status] || 5) - (order[b.status] || 5);
            });

            sortedSignals.forEach(sig => {
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => openChart(sig);
                div.id = `card-${sig.id}`;

                let badgeClass = 'badge-waiting', badgeText = '⏳ GİRİŞ BEKLİYOR';
                if(sig.status === 'ACTIVE') { badgeClass = 'badge-active'; badgeText = '⚡ İŞLEM AKTİF'; }
                if(sig.status === 'TP') { badgeClass = 'badge-tp'; badgeText = '🏆 KAR ALINDI'; }
                if(sig.status === 'SL') { badgeClass = 'badge-sl'; badgeText = '🛑 STOP OLDU'; }

                let pnlDisplay = calculatePnL(sig, sig.currentPrice || sig.entry);

                div.innerHTML = `
                    <div class="badge ${badgeClass}" id="badge-${sig.id}">${badgeText}</div>
                    <div class="symbol">${sig.symbol} <span class="dir ${sig.dir === 'LONG' ? 'long' : 'short'}">${sig.dir}</span></div>
                    <div style="font-size:12px; color:#666; margin-bottom:10px">${new Date(sig.date).toLocaleString()}</div>
                    
                    <div class="info-grid">
                        <div>Entry: <span class="info-val">${sig.entry}</span></div>
                        <div>Current: <span class="info-val" id="price-${sig.id}">${sig.currentPrice || '---'}</span></div>
                        <div>TP: <span class="info-val" style="color:#00E676">${sig.tp}</span></div>
                        <div>SL: <span class="info-val" style="color:#FF5252">${sig.sl}</span></div>
                    </div>

                    <div class="result-box">
                        <span>Sonuç:</span>
                        <span class="pnl" id="pnl-${sig.id}" style="color:${pnlDisplay.color}">${pnlDisplay.text}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function calculatePnL(sig, currentPrice) {
            if (sig.status === 'WAITING') return { text: '0.00%', color: '#888' };
            
            let exitPrice = currentPrice;
            if (sig.status === 'TP') exitPrice = sig.tp;
            if (sig.status === 'SL') exitPrice = sig.sl;

            let pct = 0;
            if (sig.dir === 'LONG') pct = ((exitPrice - sig.entry) / sig.entry) * 100;
            else pct = ((sig.entry - exitPrice) / sig.entry) * 100;

            return {
                text: (pct > 0 ? '+' : '') + pct.toFixed(2) + '%',
                color: pct >= 0 ? '#00E676' : '#FF5252'
            };
        }

        // ---------------------------------------------------------
        // 4. CANLI FİYAT (WEBSOCKET YÖNETİMİ)
        // ---------------------------------------------------------
        function restartLiveUpdates() {
            // Eğer eski bağlantı varsa kapat (Yeni semboller gelmiş olabilir)
            if (activeSocket) {
                activeSocket.close();
            }

            if (signals.length === 0) return;

            // Benzersiz sembolleri al
            const uniqueSymbols = [...new Set(signals.map(s => s.symbol.toLowerCase()))];
            const streams = uniqueSymbols.map(s => `${s}@miniTicker`).join('/');
            
            activeSocket = new WebSocket(`wss://stream.binance.com:9443/ws/${streams}`);

            activeSocket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                const price = parseFloat(data.c);
                const symbol = data.s; // Gelen sembol (örn: BTCUSDT)

                // İlgili sembole sahip tüm kartları güncelle
                signals.filter(s => s.symbol === symbol).forEach(sig => {
                    
                    // Durum Kontrolü (Sadece bitmemiş işlemlerde)
                    if (sig.status === 'WAITING' || sig.status === 'ACTIVE') {
                        if (sig.status === 'WAITING') {
                            if ((sig.dir === 'LONG' && price <= sig.entry) || (sig.dir === 'SHORT' && price >= sig.entry)) {
                                sig.status = 'ACTIVE';
                                updateCardVisuals(sig, 'ACTIVE');
                            }
                        }
                        else if (sig.status === 'ACTIVE') {
                            if ((sig.dir === 'LONG' && price >= sig.tp) || (sig.dir === 'SHORT' && price <= sig.tp)) {
                                sig.status = 'TP';
                                updateCardVisuals(sig, 'TP');
                            }
                            else if ((sig.dir === 'LONG' && price <= sig.sl) || (sig.dir === 'SHORT' && price >= sig.sl)) {
                                sig.status = 'SL';
                                updateCardVisuals(sig, 'SL');
                            }
                        }
                    }

                    // DOM Güncelleme
                    const priceEl = document.getElementById(`price-${sig.id}`);
                    const pnlEl = document.getElementById(`pnl-${sig.id}`);
                    
                    if(priceEl) priceEl.innerText = price;
                    
                    const pnlInfo = calculatePnL(sig, price);
                    if(pnlEl) {
                        pnlEl.innerText = pnlInfo.text;
                        pnlEl.style.color = pnlInfo.color;
                    }
                });
            };
        }

        function updateCardVisuals(sig, newStatus) {
            const badge = document.getElementById(`badge-${sig.id}`);
            if(!badge) return;

            if(newStatus === 'ACTIVE') {
                badge.className = 'badge badge-active';
                badge.innerText = '⚡ İŞLEM AKTİF';
            } else if(newStatus === 'TP') {
                badge.className = 'badge badge-tp';
                badge.innerText = '🏆 KAR ALINDI';
            } else if(newStatus === 'SL') {
                badge.className = 'badge badge-sl';
                badge.innerText = '🛑 STOP OLDU';
            }
        }

        // ---------------------------------------------------------
        // 5. DETAY GRAFİĞİ
        // ---------------------------------------------------------
        let chartInstance = null;
        function openChart(sig) {
            document.getElementById('modal').style.display = 'block';
            const container = document.getElementById('chart-area');
            container.innerHTML = '';

            chartInstance = LightweightCharts.createChart(container, {
                layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#242938' }, horzLines: { color: '#242938' } },
                timeScale: { timeVisible: true, secondsVisible: false },
            });
            
            const series = chartInstance.addCandlestickSeries();
            
            series.createPriceLine({ price: sig.entry, color: '#2962FF', title: 'ENTRY' });
            series.createPriceLine({ price: sig.sl, color: '#FF5252', title: 'SL' });
            series.createPriceLine({ price: sig.tp, color: '#00E676', title: 'TP' });

            fetch(`https://min-api.cryptocompare.com/data/v2/histominute?fsym=${sig.symbol.replace('USDT','')}&tsym=USDT&limit=500`)
                .then(r => r.json())
                .then(d => {
                    const data = d.Data.Data.map(i => ({ time: i.time, open: i.open, high: i.high, low: i.low, close: i.close }));
                    series.setData(data);
                });
            
            window.addEventListener('resize', () => {
                if(chartInstance) chartInstance.resize(container.clientWidth, container.clientHeight);
            });
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            if(chartInstance) {
                chartInstance.remove();
                chartInstance = null;
            }
        }

        // --- UYGULAMAYI BAŞLAT ---
        fetchAndAnalyze();

        // Her 60 saniyede bir yeni sinyal var mı diye kontrol et
        setInterval(fetchAndAnalyze, 60000);

    </script>
</body>
</html>
