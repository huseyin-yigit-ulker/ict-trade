<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Trade Bot Dashboard</title>
    
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        /* --- GENEL AYARLAR --- */
        body { margin: 0; background-color: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif; }
        
        /* --- HEADER --- */
        .app-header {
            background: #1e222d; padding: 15px 25px; border-bottom: 1px solid #2a2e39;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header-title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .status-badge { font-size: 12px; background: #2a2e39; padding: 5px 10px; border-radius: 4px; color: #888; }

        /* --- DASHBOARD GRID --- */
        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* --- HATA MESAJI KUTUSU --- */
        #error-box {
            display: none; margin: 20px; padding: 15px; border-radius: 8px;
            background: #3e1818; border: 1px solid #ff5252; color: #ff8686; font-size: 14px;
        }

        /* --- KART TASARIMI --- */
        .card {
            background: #1e222d; border: 1px solid #2a2e39; border-radius: 12px;
            padding: 20px; position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-color: #363a45; }

        /* Kart Rozetleri */
        .badge { position: absolute; top: 20px; right: 20px; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge.active { background: rgba(41, 98, 255, 0.2); color: #2962FF; border: 1px solid rgba(41, 98, 255, 0.4); animation: pulse 2s infinite; }
        .badge.waiting { background: rgba(255, 152, 0, 0.2); color: #FF9800; border: 1px solid rgba(255, 152, 0, 0.4); }
        .badge.tp { background: rgba(0, 230, 118, 0.2); color: #00E676; border: 1px solid rgba(0, 230, 118, 0.4); }
        .badge.sl { background: rgba(255, 82, 82, 0.2); color: #FF5252; border: 1px solid rgba(255, 82, 82, 0.4); }

        /* Kart İçeriği */
        .symbol-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .symbol-name { font-size: 20px; font-weight: bold; color: #fff; }
        .dir-tag { font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 3px; }
        .dir-long { color: #00E676; background: rgba(0, 230, 118, 0.1); }
        .dir-short { color: #FF5252; background: rgba(255, 82, 82, 0.1); }
        .time-text { font-size: 11px; color: #5d606b; margin-bottom: 15px; }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; }
        .data-item { display: flex; flex-direction: column; }
        .lbl { color: #787b86; font-size: 10px; margin-bottom: 2px; }
        .val { font-family: 'Courier New', monospace; font-weight: bold; }

        .pnl-area { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; }

        /* --- MODAL (GRAFİK PENCERESİ) --- */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #131722; z-index: 1000; }
        #chart-container { width: 100%; height: 100%; }
        #close-modal { position: absolute; top: 20px; right: 20px; z-index: 1010; background: #2a2e39; color: #fff; border: 1px solid #444; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
        #close-modal:hover { background: #363a45; }

        @keyframes pulse { 0% { opacity: 1; box-shadow: 0 0 0 0 rgba(41, 98, 255, 0.4); } 70% { opacity: 1; box-shadow: 0 0 0 10px rgba(41, 98, 255, 0); } 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(41, 98, 255, 0); } }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ ICT SILVER BULLET BOT</div>
        <div class="status-badge" id="conn-status">Bağlanıyor...</div>
    </div>

    <div id="error-box"></div>
    <div id="dashboard"></div>

    <div id="modal">
        <button id="close-modal" onclick="closeChart()">KAPAT [ESC]</button>
        <div id="chart-container"></div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. AYARLAR (BURAYI KENDİ BİLGİLERİNİZLE DOLDURUN)
        // ----------------------------------------------------
        const SUPABASE_URL = 'https://lwtieexeipkoezoheokp.supabase.co'; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3dGllZXhlaXBrb2V6b2hlb2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyMzQ1MTQsImV4cCI6MjA4NTgxMDUxNH0.vNd3zeObe2uOBdEOIF3MuUMdCtqAlPwR_mjq0k8OPFo";
        // ----------------------------------------------------
        // 2. DEĞİŞKENLER VE BAŞLANGIÇ
        // ----------------------------------------------------
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let signals = [];
        let activeSocket = null;
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            // Her 5 dakikada bir veritabanını yenile
            setInterval(initApp, 300000); 
        });

        // ----------------------------------------------------
        // 3. ANA FONKSİYON (INIT)
        // ----------------------------------------------------
        async function initApp() {
            const statusEl = document.getElementById('conn-status');
            const errorBox = document.getElementById('error-box');
            
            try {
                statusEl.innerText = "Veri Çekiliyor...";
                errorBox.style.display = 'none';

                // Supabase'den Veri Çek
                const { data, error } = await supabase
                    .from('signals')
                    .select('*')
                    .order('signal_time', { ascending: false })
                    .limit(50); // Son 50 sinyal

                if (error) throw error;

                if (!data || data.length === 0) {
                    document.getElementById('dashboard').innerHTML = '<div style="padding:20px; text-align:center;">Henüz hiç sinyal yok.</div>';
                    statusEl.innerText = "Veri Yok";
                    return;
                }

                // Veriyi İşle
                signals = data.map(s => ({
                    id: s.id,
                    symbol: s.symbol,
                    dir: s.direction, // DB: direction -> App: dir
                    entry: parseFloat(s.entry),
                    sl: parseFloat(s.sl),
                    tp: parseFloat(s.tp),
                    date: s.signal_time,
                    status: 'WAITING', // Başlangıç varsayılanı
                    currentPrice: 0
                }));

                statusEl.innerText = `${signals.length} Sinyal Analiz Ediliyor...`;

                // Backtest (Geçmiş Kontrolü)
                // Bu işlem asenkron olduğu için Promise.all ile hızlandırıyoruz
                await Promise.all(signals.map(analyzeSignalHistory));

                // Ekrana Bas
                renderDashboard();
                
                // Canlı Veriyi Başlat
                startWebSocket();
                statusEl.innerText = "🟢 Canlı Bağlantı";

            } catch (err) {
                console.error(err);
                statusEl.innerText = "🔴 Hata";
                errorBox.style.display = 'block';
                errorBox.innerHTML = `<b>Bağlantı Hatası:</b> ${err.message}<br>Lütfen Supabase Anon Key'in doğru olduğunu ve Tablo RLS ayarlarını kontrol edin.`;
            }
        }

        // ----------------------------------------------------
        // 4. BACKTEST (GEÇMİŞ SİMÜLASYONU)
        // ----------------------------------------------------
        async function analyzeSignalHistory(sig) {
            const signalTs = Math.floor(new Date(sig.date).getTime() / 1000);
            const nowTs = Math.floor(Date.now() / 1000);
            // CryptoCompare API (CORS dostu)
            const url = `https://min-api.cryptocompare.com/data/v2/histominute?fsym=${sig.symbol.replace('USDT','')}&tsym=USDT&limit=500&toTs=${nowTs}`;

            try {
                const res = await fetch(url);
                const json = await res.json();

                if (json.Response === 'Success') {
                    // Sinyal zamanından sonraki mumları al
                    const candles = json.Data.Data.filter(c => c.time >= signalTs);
                    
                    if (candles.length > 0) {
                        sig.currentPrice = candles[candles.length - 1].close;
                    }

                    // Mumları tek tek gezerek ne olduğunu bul
                    let isActive = false;
                    for (let c of candles) {
                        // 1. Henüz işleme girmediyse -> Giriş kontrolü
                        if (!isActive) {
                            if (sig.dir === 'LONG' && c.low <= sig.entry) isActive = true;
                            if (sig.dir === 'SHORT' && c.high >= sig.entry) isActive = true;
                            
                            if(isActive) sig.status = 'ACTIVE';
                        }
                        
                        // 2. İşlem aktifse -> TP/SL Kontrolü
                        if (isActive) {
                            if (sig.dir === 'LONG') {
                                if (c.high >= sig.tp) { sig.status = 'TP'; break; }
                                if (c.low <= sig.sl) { sig.status = 'SL'; break; }
                            } else { // SHORT
                                if (c.low <= sig.tp) { sig.status = 'TP'; break; }
                                if (c.high >= sig.sl) { sig.status = 'SL'; break; }
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn(`Backtest error for ${sig.symbol}:`, e);
            }
        }

        // ----------------------------------------------------
        // 5. RENDER (KARTLARI OLUŞTURMA)
        // ----------------------------------------------------
        function renderDashboard() {
            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            // Sıralama: Aktif > Bekleyen > Biten
            const sortedSignals = [...signals].sort((a, b) => {
                const priority = { 'ACTIVE': 1, 'WAITING': 2, 'TP': 3, 'SL': 4 };
                return priority[a.status] - priority[b.status];
            });

            sortedSignals.forEach(sig => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openChart(sig);

                // PNL Hesapla
                let pnl = 0;
                let exitPrice = (sig.status === 'TP') ? sig.tp : (sig.status === 'SL') ? sig.sl : sig.currentPrice;
                
                if (exitPrice > 0) {
                    if (sig.dir === 'LONG') pnl = ((exitPrice - sig.entry) / sig.entry) * 100;
                    else pnl = ((sig.entry - exitPrice) / sig.entry) * 100;
                }

                // PNL Renk
                const pnlColor = pnl >= 0 ? '#00E676' : '#FF5252';
                const pnlText = (pnl > 0 ? '+' : '') + pnl.toFixed(2) + '%';
                
                // Durum Metni
                let statusText = sig.status;
                if(sig.status === 'WAITING') statusText = '⏳ Bekliyor';
                if(sig.status === 'ACTIVE') statusText = '⚡ Aktif';
                
                card.innerHTML = `
                    <div class="badge ${sig.status.toLowerCase()}">${statusText}</div>
                    
                    <div class="symbol-row">
                        <div class="symbol-name">${sig.symbol}</div>
                        <div class="dir-tag ${sig.dir === 'LONG' ? 'dir-long' : 'dir-short'}">${sig.dir}</div>
                    </div>
                    <div class="time-text">${new Date(sig.date).toLocaleString('tr-TR')}</div>
                    
                    <div class="data-grid">
                        <div class="data-item"><span class="lbl">GİRİŞ (FVG)</span><span class="val">${sig.entry}</span></div>
                        <div class="data-item"><span class="lbl">ANLIK FİYAT</span><span class="val" id="price-${sig.id}">${sig.currentPrice || '---'}</span></div>
                        <div class="data-item"><span class="lbl">HEDEF (TP)</span><span class="val" style="color:#00E676">${sig.tp}</span></div>
                        <div class="data-item"><span class="lbl">STOP (SL)</span><span class="val" style="color:#FF5252">${sig.sl}</span></div>
                    </div>

                    <div class="pnl-area">
                        <span style="font-size:12px; font-weight:normal; color:#888;">PNL:</span>
                        <span id="pnl-${sig.id}" style="color:${pnlColor}">${pnlText}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ----------------------------------------------------
        // 6. WEBSOCKET (CANLI FİYAT)
        // ----------------------------------------------------
        function startWebSocket() {
            if (activeSocket) activeSocket.close();

            // Sadece benzersiz sembolleri al
            const uniqueSymbols = [...new Set(signals.map(s => s.symbol.toLowerCase()))];
            if (uniqueSymbols.length === 0) return;

            const streamName = uniqueSymbols.map(s => `${s}@miniTicker`).join('/');
            const wsUrl = `wss://stream.binance.com:9443/ws/${streamName}`;

            activeSocket = new WebSocket(wsUrl);

            activeSocket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const price = parseFloat(data.c);
                const symbolUpper = data.s; // Örn: BTCUSDT

                // İlgili sembole sahip kartları güncelle
                signals.filter(s => s.symbol === symbolUpper).forEach(sig => {
                    
                    // Sadece işlem bitmediyse güncelle
                    if (sig.status === 'ACTIVE' || sig.status === 'WAITING') {
                        sig.currentPrice = price;

                        // DOM Güncelleme (Fiyat)
                        const priceEl = document.getElementById(`price-${sig.id}`);
                        if (priceEl) priceEl.innerText = price;

                        // DOM Güncelleme (PNL)
                        const pnlEl = document.getElementById(`pnl-${sig.id}`);
                        if (pnlEl) {
                            let pnl = (sig.dir === 'LONG') ? ((price - sig.entry) / sig.entry) * 100 : ((sig.entry - price) / sig.entry) * 100;
                            pnlEl.innerText = (pnl > 0 ? '+' : '') + pnl.toFixed(2) + '%';
                            pnlEl.style.color = pnl >= 0 ? '#00E676' : '#FF5252';
                        }

                        // Canlı Durum Kontrolü (ACTIVE -> TP/SL)
                        // Not: WAITING -> ACTIVE geçişi backtest kadar basit değil, mum kapanışı gerekebilir ama basitçe değdi mi diye bakıyoruz:
                         if (sig.status === 'WAITING') {
                             if ((sig.dir === 'LONG' && price <= sig.entry) || (sig.dir === 'SHORT' && price >= sig.entry)) {
                                 sig.status = 'ACTIVE';
                                 renderDashboard(); // Durum değişti, kartı yeniden çiz
                             }
                         }
                         else if (sig.status === 'ACTIVE') {
                             if ((sig.dir === 'LONG' && price >= sig.tp) || (sig.dir === 'SHORT' && price <= sig.tp)) {
                                 sig.status = 'TP';
                                 renderDashboard();
                             }
                             else if ((sig.dir === 'LONG' && price <= sig.sl) || (sig.dir === 'SHORT' && price >= sig.sl)) {
                                 sig.status = 'SL';
                                 renderDashboard();
                             }
                         }
                    }
                });
            };
        }

        // ----------------------------------------------------
        // 7. GRAFİK MODAL İŞLEMLERİ
        // ----------------------------------------------------
        function openChart(sig) {
            const modal = document.getElementById('modal');
            const container = document.getElementById('chart-container');
            
            modal.style.display = 'block';
            container.innerHTML = ''; // Temizle

            // TradingView Lightweight Charts Kurulumu
            chartInstance = LightweightCharts.createChart(container, {
                layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#242938' }, horzLines: { color: '#242938' } },
                timeScale: { timeVisible: true, secondsVisible: false },
                rightPriceScale: { borderColor: '#2b2b43' },
            });

            const candleSeries = chartInstance.addCandlestickSeries({
                upColor: '#00E676', downColor: '#FF5252', borderVisible: false, wickUpColor: '#00E676', wickDownColor: '#FF5252'
            });

            // Seviyeleri Çiz
            const lineWidth = 2;
            candleSeries.createPriceLine({ price: sig.entry, color: '#2962FF', lineWidth: 2, lineStyle: 2, title: 'ENTRY' });
            candleSeries.createPriceLine({ price: sig.tp, color: '#00E676', lineWidth: 2, title: 'TP' });
            candleSeries.createPriceLine({ price: sig.sl, color: '#FF5252', lineWidth: 2, title: 'SL' });

            // Geçmiş Veriyi Getir
            const url = `https://min-api.cryptocompare.com/data/v2/histominute?fsym=${sig.symbol.replace('USDT','')}&tsym=USDT&limit=300`;
            
            fetch(url)
                .then(r => r.json())
                .then(d => {
                    const data = d.Data.Data.map(i => ({
                        time: i.time, open: i.open, high: i.high, low: i.low, close: i.close
                    }));
                    candleSeries.setData(data);
                });

            // ESC tuşu ile kapatma
            document.onkeydown = function(evt) {
                if (evt.key === "Escape") closeChart();
            };
        }

        function closeChart() {
            document.getElementById('modal').style.display = 'none';
            if (chartInstance) {
                chartInstance.remove();
                chartInstance = null;
            }
        }

    </script>
</body>
</html>
