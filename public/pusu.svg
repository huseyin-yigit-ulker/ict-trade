<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" rx="11" fill="#0B0E11"/>
  <g fill="none" stroke="#F5B942" stroke-linecap="round">
    <!-- outer scanning (dashed) ring -->
    <circle cx="24" cy="24" r="19.5" stroke-width="2.2" stroke-dasharray="3.5 5"/>
    <!-- mid ring -->
    <circle cx="24" cy="24" r="12.5" stroke-width="1.4" stroke-opacity="0.45"/>
    <!-- crosshair ticks -->
    <g stroke-width="2.2">
      <line x1="24" y1="5" x2="24" y2="10.5"/>
      <line x1="24" y1="37.5" x2="24" y2="43"/>
      <line x1="5" y1="24" x2="10.5" y2="24"/>
      <line x1="37.5" y1="24" x2="43" y2="24"/>
    </g>
  </g>
  <!-- lock-on strike (the ambush) -->
  <path d="M24 14 L29.5 24.5 L18.5 24.5 Z" fill="#F5B942"/>
  <!-- center core -->
  <circle cx="24" cy="24" r="2.6" fill="#F5B942"/>
