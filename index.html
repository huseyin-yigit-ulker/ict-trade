<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Journal - Multi-Coin Analysis</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div id="mode-selection">
        <h1 class="logo-title">ICT JOURNAL</h1>
        <div class="mode-container">
            <div class="mode-card" id="btn-backtest">
                <h3>📂 BACKTEST</h3>
                <p>Binance Futures Data</p>
                <div class="spinner" id="spinner"></div>
            </div>
        </div>
        <input type="file" id="jsonInput" accept=".json" style="display:none;">
    </div>

    <div id="main-app" style="display:none;">
        <div class="app-header">
            <div class="header-title">⚡ ICT TRADING JOURNAL</div>
            
            <div class="header-controls">
                <div class="multi-select-container">
                    <button id="multi-select-btn" class="coin-select">Coin Seçimi (0)</button>
                    <div id="multi-select-list" class="multi-select-content">
                        </div>
                </div>

                <button id="btn-stats" class="header-btn">📊 ÖZET TABLO</button>
            </div>
            
            <div class="status-badge" id="conn-status">Mod: Backtest</div>
        </div>
        <div id="dashboard"></div>
    </div>

    <div id="modal">
        <div id="chart-header"><h2 id="modal-title"></h2></div>
        <button id="close-modal">KAPAT [ESC]</button>
        <div id="chart-container"></div>
    </div>

    <div id="stats-modal" class="modal-overlay">
        <div class="stats-box">
            <div class="stats-header">
                <h2>PORTFÖY KARNESİ (TÜM SEMBOLLER)</h2>
                <button id="close-stats">X</button>
            </div>
            <div class="stats-content">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Sembol</th>
                            <th>İşlem</th>
                            <th>Win Rate</th>
                            <th>Toplam PnL</th>
                        </tr>
                    </thead>
                    <tbody id="stats-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="./assets/js/app.js"></script>
</body>
</html>
