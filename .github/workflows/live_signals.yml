name: Live ICT Signal Bot

on:
  schedule:
    # Every hour at HH:05 UTC — gives Binance ~5 minutes to finalize the 1h bar.
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Prevent overlapping runs if one drags past 60 minutes.
  group: live-signals
  cancel-in-progress: false

jobs:
  emit-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backtest/requirements.txt

      - name: Bağımlılıkları Yükle
        working-directory: ./backtest
        run: pip install -r requirements.txt

      - name: Live Sinyal Üreticiyi Çalıştır
        working-directory: ./backtest
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          DB_TABLE: ${{ secrets.DB_TABLE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live_runner.py
