name: ICT Signal Bot (DAG standalone)

on:
  schedule:
    # Every hour at HH:05 UTC — Binance has ~5 min to finalize the closed 1h bar.
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Don't let a slow run overlap the next scheduled one.
  group: ict-signals
  cancel-in-progress: false

jobs:
  emit-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları yükle
        # dag/dag.py tek dosya, Airflow GEREKMEZ (try/except ile opsiyonel).
        # requests[socks] -> socks5:// proxy desteği (PySocks).
        run: pip install "pandas" "requests[socks]" sqlalchemy psycopg2-binary python-dotenv

      - name: DAG sinyal üreticiyi çalıştır
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Binance 451 (ABD bloğu) için TR/EU proxy. Repo secret olarak ekle.
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
        run: python dag/dag.py
