name: Daily ICT Signal Bot

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        # psycopg2-binary ve python-dotenv eklendi
        run: |
          pip install sqlalchemy psycopg2-binary python-dotenv

      - name: Python Scriptini Çalıştır
        # İŞTE BURASI SİHİRLİ KISIM
        # GitHub Secret'ları alır ve scriptin okuyabileceği ENV değişkenlerine çevirir.
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          DB_TABLE: ${{ secrets.DB_TABLE }}
        run: python update_data.py

      - name: Değişiklikleri Kaydet ve Pushla
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik Veri Güncellemesi: ${{ github.event.head_commit.timestamp }}"
          file_pattern: "./src/assets/data/*.json"
          branch: main