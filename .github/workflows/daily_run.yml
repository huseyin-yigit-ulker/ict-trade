name: Daily ICT Signal Bot

on:
  schedule:
    # Her gün UTC 01:00'de çalışır.
    - cron: '0 1 * * *'
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write # Repoya dosya yükleyebilmesi için yazma izni

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # GÜNCELLEME: Supabase yerine SQLAlchemy ve PostgreSQL sürücüleri yüklendi
      - name: Kütüphaneleri Yükle
        run: |
          pip install sqlalchemy psycopg2-binary dotenv

      # GÜNCELLEME: Veritabanı bağlantı adresi Secret olarak verildi
      - name: Python Scriptini Çalıştır 
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: python update_data.py

      - name: Değişiklikleri Kaydet ve Pushla
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik Veri Güncellemesi: ${{ github.event.head_commit.timestamp }}"
          file_pattern: "./src/assets/data/*.json" # Sadece data klasöründeki JSON dosyalarını al
          branch: main