name: Daily ICT Signal Bot

on:
  schedule:
    # Her gün UTC saatiyle 01:00'de çalışır.
    # (Türkiye saatiyle kışın 04:00, yazın 04:00 civarı - Gün kapanışından 1 saat sonra)
    - cron: '0 1 * * *'
  workflow_dispatch: # Manuel test etmek için "Run" butonu ekler

permissions:
  contents: write # Repoya dosya yükleyebilmesi için yazma izni

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install pandas numpy requests

      - name: Python Scriptini Çalıştır 
        run: python update_data.py

      - name: Değişiklikleri Kaydet ve Pushla
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik Veri Güncellemesi: ${{ github.event.head_commit.timestamp }}"
          file_pattern: "./src/assets/data/" # Sadece bu dosyadaki değişikliği al
          branch: main # Eğer branch adın 'master' ise burayı değiştir