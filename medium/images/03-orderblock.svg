<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, system-ui, sans-serif">
  <style>
    .bg { fill: #0B0E11; }
    .green { fill: #0ECB81; }
    .red { fill: #F6465D; }
    .wick-g { stroke: #0ECB81; stroke-width: 1.5; }
    .wick-r { stroke: #F6465D; stroke-width: 1.5; }
    .ob-zone { fill: rgba(252, 213, 53, 0.15); stroke: #FCD535; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .grid { stroke: #2B3139; stroke-width: 0.5; stroke-dasharray: 2 4; }
    .label { fill: #EAECEF; font-size: 12px; font-weight: 600; }
    .accent { fill: #FCD535; font-size: 13px; font-weight: 700; }
    .muted { fill: #848E9C; font-size: 11px; }
    .title { fill: #EAECEF; font-size: 16px; font-weight: 700; letter-spacing: 0.05em; }
  </style>

  <rect class="bg" width="800" height="360"/>

  <text class="title" x="20" y="30">Order Block (OB) — Kurumun Ayak İzi</text>
  <text class="muted" x="20" y="50">İmpulse'tan ÖNCEKİ son zıt yönlü mum gövdesi. Kurum buradan başladı.</text>

  <!-- candle scene -->
  <g transform="translate(40, 80)">
    <!-- sideways accumulation -->
    <line class="wick-r" x1="20" y1="100" x2="20" y2="135"/>
    <rect class="red" x="14" y="105" width="12" height="22"/>
    <line class="wick-g" x1="50" y1="125" x2="50" y2="98"/>
    <rect class="green" x="44" y="102" width="12" height="20"/>
    <line class="wick-r" x1="80" y1="100" x2="80" y2="135"/>
    <rect class="red" x="74" y="106" width="12" height="22"/>

    <!-- THE OB CANDLE: last bearish before bullish impulse -->
    <line stroke="#FCD535" stroke-width="2.5" x1="115" y1="100" x2="115" y2="148"/>
    <rect fill="#F6465D" stroke="#FCD535" stroke-width="2" x="108" y="115" width="14" height="28"/>

    <!-- impulse: 4 strong green candles -->
    <line class="wick-g" x1="150" y1="125" x2="150" y2="80"/>
    <rect class="green" x="144" y="84" width="12" height="44"/>

    <line class="wick-g" x1="180" y1="90" x2="180" y2="40"/>
    <rect class="green" x="174" y="44" width="12" height="50"/>

    <line class="wick-g" x1="210" y1="50" x2="210" y2="10"/>
    <rect class="green" x="204" y="14" width="12" height="40"/>

    <line class="wick-g" x1="240" y1="20" x2="240" y2="-10"/>
    <rect class="green" x="234" y="-6" width="12" height="32"/>

    <!-- pullback later -->
    <line class="wick-r" x1="280" y1="-15" x2="280" y2="40"/>
    <rect class="red" x="274" y="-10" width="12" height="50"/>
    <line class="wick-r" x1="310" y1="20" x2="310" y2="80"/>
    <rect class="red" x="304" y="30" width="12" height="48"/>
    <line class="wick-r" x1="340" y1="60" x2="340" y2="120"/>
    <rect class="red" x="334" y="85" width="12" height="35"/>

    <!-- OB zone extends right (highlight body of red candle) -->
    <rect class="ob-zone" x="-20" y="115" width="420" height="28"/>

    <!-- labels -->
    <text class="accent" x="135" y="170" font-size="13">OB</text>
    <path d="M115 158 L115 148" stroke="#FCD535" stroke-width="1.5" fill="none" marker-end="url(#arrY)"/>

    <!-- impulse label -->
    <text fill="#0ECB81" x="180" y="-25" font-size="13" font-weight="700">İMPULSE</text>
    <path d="M150 5 L240 -5" stroke="#0ECB81" stroke-width="1.5" fill="none" marker-end="url(#arrG)"/>

    <!-- pullback to OB -->
    <text class="muted" x="290" y="155">→ pullback</text>
    <path d="M380 145 L405 130" stroke="#FCD535" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
  </g>

  <!-- right legend -->
  <g transform="translate(540, 200)">
    <rect fill="#181A20" stroke="#2B3139" x="0" y="0" width="240" height="120" rx="6"/>
    <text class="title" x="14" y="22" font-size="13">OB Mantığı</text>
    <text class="muted" x="14" y="44" font-size="11">Kurum büyük emir verecek →</text>
    <text class="muted" x="14" y="60" font-size="11">önce ters yönde ufak hareket,</text>
    <text class="muted" x="14" y="76" font-size="11">sonra patlayıcı asıl hareket.</text>
    <text class="accent" x="14" y="100" font-size="11">İlk dönüş bu zone'a → tepki.</text>
  </g>

  <defs>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0ECB81"/>
    </marker>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#FCD535"/>
    </marker>
  </defs>
</svg>
