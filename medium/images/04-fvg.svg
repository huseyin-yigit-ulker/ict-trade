<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, system-ui, sans-serif">
  <style>
    .bg { fill: #0B0E11; }
    .green { fill: #0ECB81; }
    .red { fill: #F6465D; }
    .wick-g { stroke: #0ECB81; stroke-width: 1.5; }
    .wick-r { stroke: #F6465D; stroke-width: 1.5; }
    .fvg-zone { fill: rgba(14, 203, 129, 0.18); stroke: #0ECB81; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .grid { stroke: #2B3139; stroke-width: 0.5; stroke-dasharray: 2 4; }
    .label { fill: #EAECEF; font-size: 12px; font-weight: 600; }
    .accent { fill: #FCD535; font-size: 13px; font-weight: 700; }
    .muted { fill: #848E9C; font-size: 11px; }
    .title { fill: #EAECEF; font-size: 16px; font-weight: 700; letter-spacing: 0.05em; }
  </style>

  <rect class="bg" width="800" height="360"/>

  <text class="title" x="20" y="30">Fair Value Gap (FVG) — Fiyatın Doldurmadığı Boşluk</text>
  <text class="muted" x="20" y="50">3 ardışık bar. Ortadaki büyük gövde. 1. bar'ın high'ı ile 3. bar'ın low'u arasındaki boşluk = FVG.</text>

  <!-- bullish FVG demonstration -->
  <g transform="translate(40, 80)">

    <!-- bar 1 (small green) -->
    <line class="wick-g" x1="60" y1="200" x2="60" y2="160"/>
    <rect class="green" x="54" y="165" width="12" height="32"/>
    <text class="muted" x="50" y="220">bar i-1</text>

    <!-- bar 2 (HUGE green body, body covers gap) -->
    <line class="wick-g" x1="120" y1="170" x2="120" y2="65"/>
    <rect class="green" x="114" y="70" width="12" height="98"/>
    <text fill="#0ECB81" x="105" y="220" font-weight="700">bar i</text>

    <!-- bar 3 (small green) -->
    <line class="wick-g" x1="180" y1="100" x2="180" y2="65"/>
    <rect class="green" x="174" y="70" width="12" height="28"/>
    <text class="muted" x="170" y="220">bar i+1</text>

    <!-- FVG zone shaded between bar i-1 high (line) and bar i+1 low -->
    <rect class="fvg-zone" x="40" y="100" width="240" height="60"/>
    <text class="accent" x="180" y="145" font-size="14" fill="#FCD535">FVG</text>

    <!-- continuation -->
    <line class="wick-g" x1="240" y1="115" x2="240" y2="60"/>
    <rect class="green" x="234" y="65" width="12" height="40"/>
    <line class="wick-r" x1="270" y1="105" x2="270" y2="160"/>
    <rect class="red" x="264" y="115" width="12" height="40"/>
    <line class="wick-r" x1="300" y1="125" x2="300" y2="170"/>
    <rect class="red" x="294" y="140" width="12" height="22"/>

    <!-- annotation: pullback to FVG -->
    <text class="muted" x="310" y="135">→ fiyat geri dönüyor</text>
    <text class="muted" x="310" y="152">FVG'yi 'doldurmaya'</text>

    <!-- formula box -->
    <g transform="translate(380, 80)">
      <rect fill="#181A20" stroke="#2B3139" x="0" y="0" width="280" height="160" rx="6"/>
      <text class="title" x="14" y="22" font-size="13">Bullish FVG Tespit</text>
      <text class="muted" x="14" y="50" font-family="JetBrains Mono, monospace" font-size="11">if bar[i+1].low &gt; bar[i-1].high:</text>
      <text class="muted" x="14" y="68" font-family="JetBrains Mono, monospace" font-size="11">    fvg = (bar[i-1].high,</text>
      <text class="muted" x="14" y="84" font-family="JetBrains Mono, monospace" font-size="11">           bar[i+1].low)</text>
      <line stroke="#2B3139" stroke-dasharray="2 4" x1="14" y1="98" x2="266" y2="98"/>
      <text class="accent" x="14" y="118" font-size="11">FVG = piyasanın aceleyle</text>
      <text class="accent" x="14" y="134" font-size="11">geçtiği fiyat aralığı.</text>
      <text class="muted" x="14" y="150" font-size="11">Sıkça geri dönüp dolduruluyor.</text>
    </g>
  </g>
</svg>
