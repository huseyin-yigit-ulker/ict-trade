services:
  - type: web
    name: pusu-signals
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
        sync: false
      - key: BACKTESTING_VITE_SUPABASE_URL
        sync: false
      - key: BACKTESTING_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
        sync: false
